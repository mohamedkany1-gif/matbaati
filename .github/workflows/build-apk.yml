name: Build Matbaati APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir -p build/www
          cp index.html app.js supabase.min.js manifest.webmanifest icon-192.png icon-512.png version.json build/www/
          cd build
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "matbaati" com.matbaati.app --web-dir=www
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../icon-512.png "$d/ic_launcher.png"
            cp ../icon-512.png "$d/ic_launcher_round.png"
            cp ../icon-512.png "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          cd build/android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No KEYSTORE_B64 secret, building a debug APK instead"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          cd build/android/app/build/outputs/apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/matbaati.keystore
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p 4 release/app-release-unsigned.apk /tmp/aligned.apk
            $BT/apksigner sign --ks /tmp/matbaati.keystore --ks-pass pass:matbaati-ks-2026 --key-pass pass:matbaati-ks-2026 --ks-key-alias matbaati --out "$GITHUB_WORKSPACE/matbaati.apk" /tmp/aligned.apk
          else
            cp debug/app-debug.apk "$GITHUB_WORKSPACE/matbaati.apk"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: مطبعتي APK ${{ github.run_number }}
          files: matbaati.apk

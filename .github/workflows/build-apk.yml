name: Build Matbaati APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p build/www
          cp index.html app.js sw.js supabase.min.js manifest.webmanifest icon-192.png icon-512.png version.json build/www/

          cd build

          npm init -y
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7

          npx cap init "Matbaati" com.matbaati.app --web-dir=www

          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.server={url:'https://mohamedkany1-gif.github.io/matbaati/',cleartext:false,allowNavigation:['mohamedkany1-gif.github.io','*.supabase.co']};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"

          cat capacitor.config.json

          npx cap add android

          python3 - <<'PYEOF'
          import re

          p = 'android/app/src/main/res/values/styles.xml'
          x = open(p, encoding='utf-8').read()

          items = ('        <item name="android:statusBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:navigationBarColor">@android:color/transparent</item>\n'
                   '        <item name="android:windowLightStatusBar">true</item>\n'
                   '        <item name="android:windowLightNavigationBar">true</item>\n')

          m = re.search(r'(<style name="AppTheme\.NoActionBar" parent="[^"]*">\n)', x)

          assert m, 'NoActionBar style not found'

          x = x[:m.end()] + items + x[m.end():]

          open(p, 'w', encoding='utf-8').write(x)

          print(x)
          PYEOF

          cat > android/app/src/main/java/com/matbaati/app/MainActivity.java <<'JAVAEOF'
          package com.matbaati.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private final Handler h = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                      getWindow().setStatusBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  final View root = getWindow().getDecorView();

                  root.getViewTreeObserver().addOnGlobalLayoutListener(new android.view.ViewTreeObserver.OnGlobalLayoutListener() {
                      @Override
                      public void onGlobalLayout() {
                          push(root);
                      }
                  });

                  h.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          push(root);
                          h.postDelayed(this, 1000);
                      }
                  }, 500);
              }

              private void push(View root) {
                  try {
                      WindowInsetsCompat i = ViewCompat.getRootWindowInsets(root);

                      if (i == null || getBridge() == null) return;

                      WebView w = getBridge().getWebView();

                      if (w == null) return;

                      Insets bars = i.getInsets(
                          WindowInsetsCompat.Type.systemBars() |
                          WindowInsetsCompat.Type.displayCutout()
                      );

                      float d = getResources().getDisplayMetrics().density;

                      int t = Math.round(bars.top / d);
                      int b = Math.round(bars.bottom / d);

                      w.evaluateJavascript(
                          "document.documentElement.style.setProperty('--safe-area-inset-top','" + t + "px');" +
                          "document.documentElement.style.setProperty('--safe-area-inset-bottom','" + b + "px');",
                          null
                      );

                      if (Build.VERSION.SDK_INT >= 30 &&
                          w.getLayoutParams() instanceof ViewGroup.MarginLayoutParams) {

                          ViewGroup.MarginLayoutParams mp =
                              (ViewGroup.MarginLayoutParams) w.getLayoutParams();

                          int kb = i.isVisible(WindowInsetsCompat.Type.ime())
                              ? i.getInsets(WindowInsetsCompat.Type.ime()).bottom
                              : 0;

                          if (mp.bottomMargin != kb) {
                              mp.bottomMargin = kb;
                              w.setLayoutParams(mp);
                          }
                      }

                  } catch (Throwable e) {
                  }
              }
          }
          JAVAEOF

          python3 - <<'PYEOF2'
          import re

          mp = 'android/app/src/main/AndroidManifest.xml'
          m = open(mp, encoding='utf-8').read()

          if 'windowSoftInputMode' in m:
              m = re.sub(
                  r'android:windowSoftInputMode="[^"]*"',
                  'android:windowSoftInputMode="adjustResize"',
                  m
              )
          else:
              m = re.sub(
                  r'<activity\b',
                  '<activity android:windowSoftInputMode="adjustResize"',
                  m,
                  count=1
              )

          open(mp, 'w', encoding='utf-8').write(m)
          PYEOF2

          grep -n 'adjustResize' android/app/src/main/AndroidManifest.xml || (echo 'manifest patch failed'; exit 1)

          npx cap sync android

          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          for d in android/app/src/main/res/mipmap-*; do
            cp ../icon-512.png "$d/ic_launcher.png"
            cp ../icon-512.png "$d/ic_launcher_round.png"
            cp ../icon-512.png "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd build/android

          chmod +x gradlew

          if [ -n "${KEYSTORE_B64:-}" ]; then
            test -n "${KEYSTORE_PASSWORD:-}" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
            test -n "${KEY_ALIAS:-}" || { echo "Missing KEY_ALIAS"; exit 1; }
            test -n "${KEY_PASSWORD:-}" || { echo "Missing KEY_PASSWORD"; exit 1; }

            ./gradlew assembleRelease --no-daemon
          else
            echo "No signing secrets configured. Building debug APK."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd build/android/app/build/outputs/apk

          if [ -n "${KEYSTORE_B64:-}" ]; then

            echo "$KEYSTORE_B64" | base64 -d > /tmp/matbaati.keystore

            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

            "$BT/zipalign" -p 4 release/app-release-unsigned.apk /tmp/aligned.apk

            "$BT/apksigner" sign \
              --ks /tmp/matbaati.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --out "$GITHUB_WORKSPACE/matbaati.apk" \
              /tmp/aligned.apk

            "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/matbaati.apk"

            rm -f /tmp/matbaati.keystore /tmp/aligned.apk

          else

            cp debug/app-debug.apk "$GITHUB_WORKSPACE/matbaati.apk"

          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Matbaati APK ${{ github.run_number }}
          files: matbaati.apk

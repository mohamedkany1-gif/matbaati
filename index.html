<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>مطبعتي</title>
<style>
:root{--t:#0e7c86;--t2:#16a5a0;--p:#e5368a;--y:#f2c200;--k:#1b1b1b;--bg:#eaf5f5;--ink:#0b3b40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:26px 22px 96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.lg{width:46px;height:46px;border-radius:14px;background:var(--t);color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
.ti{font-size:22px;font-weight:800;flex:1}.sub{font-size:13px;opacity:.65;font-weight:400;display:block}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{border-radius:24px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,var(--t),var(--t2));color:#fff}
.big b{font-size:34px;display:block;margin:4px 0}.big small{font-size:13px;opacity:.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.tile{background:#fff;border-radius:22px;padding:16px 14px;font-weight:700;font-size:17px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;border:0;border-top:6px solid var(--t);text-align:right;color:var(--ink);font-family:inherit;width:100%}
.tile small{font-weight:400;font-size:12px;opacity:.7}.tile svg{width:30px;height:30px}
.h2{font-size:15px;font-weight:800;margin:16px 4px 6px}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:13px 14px;margin-top:9px;font-size:15px;gap:10px;width:100%;border:0;text-align:right;color:var(--ink);font-family:inherit}
.row .n{font-weight:700}.row .d{font-size:12px;opacity:.65;font-weight:400;display:block;margin-top:2px}
.m{color:var(--p);font-weight:800;white-space:nowrap}.c{color:var(--t);font-weight:800;white-space:nowrap}.z{opacity:.5;white-space:nowrap}
.sr{display:flex;gap:8px;margin-bottom:6px}
input,textarea{width:100%;border:2px solid transparent;background:#fff;border-radius:16px;padding:14px;font-size:16px;font-family:inherit;color:var(--ink);outline:0}
input:focus,textarea:focus{border-color:var(--t)}
.fab{position:fixed;bottom:84px;left:18px;width:58px;height:58px;border-radius:20px;border:0;background:var(--p);color:#fff;box-shadow:0 6px 18px #0003;display:flex;align-items:center;justify-content:center;z-index:5}
.fab svg{width:30px;height:30px;stroke-width:2.6}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px 0 calc(16px + env(safe-area-inset-bottom));z-index:6;font-size:12px}
.nav a{display:block;text-align:center;font-size:12px;color:var(--ink);text-decoration:none}.nav a span{display:block;font-size:20px}
.nav a.on{color:var(--t);font-weight:800}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;font-family:inherit;background:var(--t);color:#fff;margin-top:10px}
.btn.p{background:var(--p)}.btn.del{background:#fff;color:#c0262d;border:2px solid #f3c9cc}.btn.w{background:#fff;color:var(--t)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px;margin-bottom:10px}
.sh-h button{border:0;background:#fff;border-radius:12px;width:36px;height:36px;font-size:16px;color:var(--ink)}
label{display:block;font-size:14px;font-weight:700;margin:10px 2px}label>input,label>textarea{margin-top:6px;font-weight:400}
.err{color:#c0262d;font-size:14px;margin-top:8px;min-height:4px}
.empty{text-align:center;opacity:.6;padding:40px 10px;font-size:15px}
.center{display:flex;flex-direction:column;align-items:center;padding-top:60px}
.center .lg{width:110px;height:110px;border-radius:30px;font-size:70px}
.center h1{font-size:34px;margin:14px 0 2px}.center p{opacity:.65;margin:0 0 26px;font-size:14px;text-align:center}
.center form{width:100%}
.bal{border-radius:24px;padding:18px;color:#fff;margin-bottom:12px}.bal b{font-size:32px;display:block;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chips a{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--t);text-decoration:none;display:flex;gap:6px;align-items:center}
.chips svg{width:18px;height:18px}
.x{border:0;background:none;color:#c0262d;font-size:13px;font-family:inherit;padding:6px}
.ban{background:#fff7d6;border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.hm .top{margin-bottom:16px}.hm .lg{cursor:pointer}.hm .t{font-size:24px;font-weight:800}.hm .h{font-size:13px;opacity:.65}
.hm .big b{margin:0}
.hm .tile{padding:18px 14px;min-height:112px;border-radius:22px;font-size:17px;align-items:stretch}.hm .tile .ic{font-size:32px}.hm .g{margin-bottom:0}
.hm .row{padding:12px 14px;font-size:14px;margin-top:10px}.hm .row b{font-weight:700}
.lw{display:flex;flex-direction:column;align-items:center;margin-top:64px}.lw .lgo{width:110px;height:110px;border-radius:30px;background:var(--t);color:#fff;font-weight:900;font-size:70px;display:flex;align-items:center;justify-content:center}
.lw .lt{font-size:34px;font-weight:800;margin-top:14px}.lw .lh{font-size:13px;opacity:.65;margin-bottom:40px}
.lw form{width:100%}.lw input{border:0;border-radius:18px;padding:16px;font-size:15px;opacity:.9;margin-bottom:12px;text-align:right}
.lw input::placeholder{color:var(--ink);opacity:1}.lw .f1{border-right:6px solid var(--t)}.lw .f2{border-right:6px solid var(--p);margin-bottom:22px}
.lw .lb{width:100%;background:var(--t);color:#fff;border:0;border-radius:18px;padding:16px;text-align:center;font-weight:800;font-size:18px;font-family:inherit}
.lw .err{margin:0;min-height:0}.lw .forgot{font-size:13px;opacity:.65;margin-top:18px}.lw .dots{display:flex;gap:8px;margin-top:60px}.lw .dots b{width:14px;height:14px;border-radius:50%}
</style>
</head>
<body>
<div id="app"><div class="empty" id="ld">جاري التحميل…</div></div>
<div id="modal"></div>
<script>
window.addEventListener('unhandledrejection',function(e){window.onerror(String((e.reason&&e.reason.message)||e.reason),'app.js',0)});
window.onerror=function(m,u,l){var a=document.getElementById('app');if(a)a.innerHTML='<div class="empty" style="direction:ltr;text-align:left">حصل خطأ في البرنامج. صوّر الشاشة وابعتها:<br><br>'+String(m).replace(/</g,'&lt;')+'<br>'+String(u).split('/').pop()+':'+l+'</div>'};
window.ldT=setTimeout(function(){if(document.getElementById('ld'))document.getElementById('app').innerHTML='<div class="empty">الصفحة مفتحتش كويس. اتأكد إن كل ملفات فولدر site (خصوصًا app.js و supabase.min.js) في نفس الفولدر، وجرّب متصفح كروم.</div>'},4000);
</script>
<script src="supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>

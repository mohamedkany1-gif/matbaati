:root{--t:#0e7c86;--t2:#16a5a0;--p:#e5368a;--y:#f2c200;--k:#1b1b1b;--bg:#eaf5f5;--ink:#0b3b40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--sat:calc(max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))/var(--tz,1));--sab:calc(max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))/var(--tz,1))}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(18px + var(--sat)) 16px 96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lg{width:46px;height:46px;border-radius:14px;background:var(--t);color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
.ti{font-size:22px;font-weight:800;flex:1}.sub{font-size:13px;opacity:.65;font-weight:400;display:block}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{border-radius:24px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,var(--t),var(--t2));color:#fff}
.big b{font-size:34px;display:block;margin:4px 0}.big small{font-size:13px;opacity:.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.tile{background:#fff;border-radius:22px;padding:16px 14px;font-weight:700;font-size:17px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;border:0;border-top:6px solid var(--t);text-align:right;color:var(--ink);font-family:inherit;width:100%}
.tile small{font-weight:400;font-size:12px;opacity:.7}.tile svg{width:30px;height:30px}
.tile.lg2,.tile.lg3{font-size:14px;line-height:1.35}.tile.nm span{line-height:1.3;text-wrap:balance}

.lc{display:flex;flex-direction:column;align-items:center;width:100%;background:#fff;border-radius:30px;padding:26px 20px 24px;box-shadow:0 18px 50px #0b3b4040;animation:lwin .7s cubic-bezier(.2,.9,.3,1.2) both}
.lw input{background:var(--bg)}
.lw .lh{margin-bottom:30px}.lw .dots{margin-top:34px}
.lw .dots b{animation:lgdot 1.6s ease-in-out infinite}.lw .dots b:nth-child(2){animation-delay:.15s}.lw .dots b:nth-child(3){animation-delay:.3s}.lw .dots b:nth-child(4){animation-delay:.45s}
@keyframes lgdot{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lwin{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.lc{position:relative;overflow:hidden;min-height:calc(var(--vh,100vh)*.8);justify-content:center;padding:40px 22px 30px}
.lc::before{content:"";position:absolute;top:0;left:26px;right:26px;height:6px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--t) 0 25%,var(--p) 25% 50%,var(--y) 50% 75%,var(--k) 75% 100%)}
.lc::after{content:"";position:absolute;left:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#16a5a022,#16a5a000 70%);pointer-events:none}

      (es.length ? es.map(e => `<button class="row" data-act="edit-w" data-id="${e.id}"><span class="n">${e.op === 'withdraw' ? 'سحب' : 'إيداع'}<span class="d">${esc(String(e.created_at || '').slice(0, 10))}</span></span><span class="c" style="color:${e.op === 'withdraw' ? '#c0262d' : '#16845b'}">${e.op === 'withdraw' ? '-' : '+'}${fmt(e.amount)}</span></button>`).join('') : '<div class="empty">مفيش عمليات.</div>') +
      `<button class="fab" data-act="add-w" data-name="${esc(es.length ? es[0].name : nm)}">${svg('plus')}</button>` + nav('home');
  }
  const g = {}; all.forEach(e => { (g[nk(e.name)] = g[nk(e.name)] || []).push(e); });
  const ps = Object.keys(g).map(n => ({n, name: g[n].slice().sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)))[0].name, rem: wrem(g[n]), cnt: g[n].length})).sort((x, y) => x.name.localeCompare(y.name, 'ar'));
  const tot = wrem(all);
  return head(WK[k], `${ps.length} عميل`, {back: true, gear: false}) +
    `<div class="bal" style="background:linear-gradient(135deg,#0e7c86,#16a5a0)"><small>إجمالي المتبقي</small><b>${tot < 0 ? '-' : ''}${fmt(Math.abs(tot))} ج</b></div>` +
    (ps.length ? ps.map(p => `<button class="row" data-go="w/${k}/${encodeURIComponent(p.n)}"><span class="n">${esc(p.name)}<span class="d">${p.cnt} عملية</span></span><span class="c">${remHTML(p.rem)}</span></button>`).join('') : '<div class="empty">مفيش حاجة لسه. اضغط + عشان تضيف.</div>') +
    `<button class="fab" data-act="add-w">${svg('plus')}</button>` + nav('home');
}

/* ---------- backup ---------- */
const xe = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
function sheet(name, rows) {
  return `<Worksheet ss:Name="${xe(name)}"><Table>${rows.map(r => `<Row>${r.map(c => typeof c === 'number' ? `<Cell><Data ss:Type="Number">${c}</Data></Cell>` : `<Cell><Data ss:Type="String">${xe(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/></WorksheetOptions></Worksheet>`;
}
function backup() {
  const nm = id => (S.customers.find(c => c.id === id) || {}).name || '';
  const sheets = [
    sheet('الأصناف', [['الاسم', 'السعر', 'التفاصيل']].concat(S.items.map(i => [i.name, Number(i.price), i.details || '']))),
    sheet('العملاء', [['الاسم', 'التليفون', 'العنوان', 'ملاحظات', 'الرصيد (موجب = مدين)']].concat(S.customers.map(c => [c.name, c.phone || '', c.address || '', c.notes || '', balance(c.id)]))),
    sheet('أماكن الصيانة', [['الاسم', 'الخدمة', 'التليفون', 'العنوان', 'ملاحظات']].concat(S.places.map(p => [p.name, p.service || '', p.phone || '', p.address || '', p.notes || '']))),
    sheet('الحركات', [['التاريخ', 'العميل', 'النوع', 'المبلغ', 'ملاحظة']].concat(S.ledger.map(e => [e.entry_date, nm(e.customer_id), e.kind === 'debit' ? 'دين عليه' : 'دفعة منه', Number(e.amount), e.note || ''])))
  ];
  const xml = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' + sheets.join('') + '</Workbook>';
  const fname = 'matbaati-backup-' + today() + '.xls';
  if (NATIVE) {
    (async () => {
      try {
        const C = window.Capacitor || {};
        const call = async (p, m, o) => {
          const tries = [];
          if (C.nativePromise) tries.push(() => C.nativePromise(p, m, o));
          if (C.Plugins && C.Plugins[p] && C.Plugins[p][m]) tries.push(() => C.Plugins[p][m](o));
          if (C.registerPlugin) tries.push(() => C.registerPlugin(p)[m](o));
          let last = new Error('إضافة الملفات مش موجودة');
          for (const t of tries) { try { return await t(); } catch (e) { if (/cancel/i.test(String(e && e.message || e))) throw e; last = e; } }
          throw last;
        };
        const r = await call('Filesystem', 'writeFile', {path: fname, data: xml, directory: 'CACHE', encoding: 'utf8'});
        await call('Share', 'share', {title: 'نسخة مطبعتي الاحتياطية', url: r.uri, dialogTitle: 'احفظ أو ابعت النسخة'});
        localStorage.setItem('mt_lastbackup', String(Date.now()));
      } catch (e) { if (!/cancel/i.test(String(e && e.message || e))) tell('تعذر عمل النسخة: ' + errMsg(e)); }
    })();
    return;
  }
  const blob = new Blob([xml], {type: 'application/vnd.ms-excel'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  localStorage.setItem('mt_lastbackup', String(Date.now()));
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}

  <button class="btn" data-act="backup">نسخة احتياطية Excel</button>

/* ---------- auth screens ---------- */
function setupScreen() {
  $('#app').innerHTML = `<div class="center"><div class="lg">م</div><h1>مطبعتي</h1><p>أول مرة بس: الصق بيانات الاتصال بقاعدة البيانات</p>

  $('#sf').onsubmit = e => {
    e.preventDefault();

function loginScreen() {
  BOOTOK = true;
  document.body.classList.add('lgn');
  $('#app').innerHTML = `<div class="lw"><div class="lc"><div class="lgo">م</div><div class="lt">مطبعتي</div><div class="lh">سجّل دخولك عشان تبدأ</div>

  <div class="forgot" id="fgl">نسيت كلمة السر؟</div>
  <div class="dots"><b style="background:var(--t)"></b><b style="background:var(--p)"></b><b style="background:var(--y)"></b><b style="background:var(--k)"></b></div></div></div>`;
  const lfm = $('#lf');

  $('#fgl').onclick = forgotBox;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(e.target));

    const b = e.target.querySelector('.lb'); b.disabled = true; document.body.classList.add('go');

    const {error} = await sb.auth.signInWithPassword({email: em, password: o.pw});
    if (error) { document.body.classList.remove('go'); $('#ferr').textContent = loginMsg(error); $('#ferr').style.marginTop = '10px'; b.disabled = false; return; }
    GREET_T0 = Date.now();

}

/* ---------- boot & events ---------- */
async function boot() {
    READY = false;
  if (DEMO) { await loadAll(); if (!location.hash) location.hash = '#/home'; render(); return; }
  const c = cfg();
  if (!c) { setupScreen(); return; }
  if (!sb) sb = supabase.createClient(c.url, c.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, lock: async (n, t, fn) => await fn()}, global: {fetch: tfetch}});
  const hasTok = Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k) || k === 'supabase.auth.token');
  if (!hasTok) { loginScreen(); return; }
  const cached = loadCache();
  NODATA = !cached;
  READY = true;
  if (!location.hash) location.hash = '#/home';
  render();
  let data; try { ({data} = await withTmo(sb.auth.getSession(), 12000)); } catch (e) { return; }
  if (!data.session) { READY = false; loginScreen(); return; }
  const m0 = MUT;
  try { await withTmo(loadAll(), 25000); if (m0 === MUT) render(); } catch (e) {
    if (m0 === MUT && !NODATA) render();
    if (!cached) setTimeout(boot, 8000);
  }
}
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) { Q = ''; location.hash = '#/' + g.dataset.go; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  if (a === 'close') closeModal();
  else if (a === 'back') { if (history.length > 1) history.back(); else location.hash = '#/customers'; }
  else if (a === 'settings') settings();
  else if (a === 'backup') backup();
  else if (a === 'refresh') { const before = JSON.stringify(S); try { await withTmo(loadAll(), 25000); } catch (x) { closeModal(); tell('تعذر التحديث: ' + errMsg(x)); return; } render(); closeModal(); tell(JSON.stringify(S) === before ? 'لا يوجد تحديث، البيانات محدثة' : 'تم تحديث البيانات'); }
  else if (a === 'logout') { { await sb.auth.signOut(); try { localStorage.removeItem(CK); } catch (e) {} closeModal(); boot(); } }
  else if (a === 'add-w') walletForm(null, el.dataset.name);
  else if (a === 'edit-w') walletForm((S.wallet || []).find(x => x.id === id));
  else if (a === 'add-item') itemForm();
  else if (a === 'edit-item') itemForm(S.items.find(x => x.id === id));
  else if (a === 'add-customer') customerForm();
  else if (a === 'edit-customer') customerForm(S.customers.find(x => x.id === id));
  else if (a === 'add-place') placeForm();
  else if (a === 'edit-place') placeForm(S.places.find(x => x.id === id));
  else if (a === 'add-debit') entryForm(id, 'debit');
  else if (a === 'add-credit') entryForm(id, 'credit');
  else if (a === 'del-entry') { if (await askC('حذف الحركة دي؟', 'احذف')) { try { await mut('ledger', 'del', null, id); } catch (x) { tell(errMsg(x)); } } }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { Q = e.target.value; redrawList(); } });
window.addEventListener('hashchange', () => { Q = ''; if (READY || DEMO) render(); window.scrollTo(0, 0); });

if ('serviceWorker' in navigator && !DEMO && location.protocol.startsWith('http')) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let hiddenAt = 0, resBusy = false;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!hiddenAt || Date.now() - hiddenAt < 20000 || resBusy || !READY) return;
  resBusy = true;
  try {
    const m0 = MUT, before = JSON.stringify(S);
    await loadAll();
    const m = $('#modal');
    if (m0 === MUT && JSON.stringify(S) !== before && !(m && m.classList.contains('on')) && !document.activeElement.matches('input,textarea,select')) render();
  } catch (e) {} finally { resBusy = false; hiddenAt = Date.now(); }
});
}
